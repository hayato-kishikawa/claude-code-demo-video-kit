<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>空き状況 — ヘヤマド（架空のサービス）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="logo" href="index.html"><span class="logo-mark"><i></i><i></i><i></i><i></i></span>ヘヤマド</a>
    <ul>
      <li><a class="on" href="app-availability.html">空き状況</a></li>
      <li><a href="#">自分の予約</a></li>
      <li><a href="app-usage.html">利用状況</a></li>
      <li><a href="#">部屋の設定</a></li>
    </ul>
    <div class="org">本社ビル（3F–8F）<br>36 室</div>
  </aside>
  <div class="main">
    <header class="topbar"><h2>空き状況</h2><div class="user"><span>総務部 青木</span><span class="avatar">青</span></div></header>
    <div class="content">
      <dl class="filters">
        <div class="chip"><dt>日付</dt><dd>11月14日（金）</dd></div>
        <div class="chip on"><dt>時間</dt><dd>14:00 – 15:00</dd></div>
        <div class="chip on"><dt>人数</dt><dd>6 名</dd></div>
        <div class="chip"><dt>設備</dt><dd>モニター</dd></div>
        <div class="count"><strong>12</strong>室が空いています</div>
      </dl>
      <div class="avail">
        <div><div class="facade" id="facade"></div><div class="street"></div></div>
        <aside class="detail">
          <div class="where">7F ・ ROOM 7-01</div>
          <h3>楓</h3>
          <ul>
            <li><span>定員</span><b>8 名</b></li>
            <li><span>設備</span><b>モニター・ホワイトボード</b></li>
            <li><span>この部屋の今日</span><b>14:00 から空き</b></li>
          </ul>
          <div class="slots"><i></i><i></i><i class="sel"></i><i class="free"></i><i class="free"></i><i></i></div>
          <div class="slots-label"><span>12:00</span><span>14:00</span><span>16:00</span><span>18:00</span></div>
          <a class="btn btn-primary" href="app-booked.html">14:00–15:00 で予約する</a>
        </aside>
      </div>
    </div>
  </div>
</div>
<script src="facade.js"></script>
<script>drawFacade(document.getElementById("facade"));</script>
</body>
</html>
