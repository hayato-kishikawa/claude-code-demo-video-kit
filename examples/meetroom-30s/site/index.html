<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>ヘヤマド — 会議室予約（架空のサービス）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="lp">
  <header class="lp-nav">
    <a class="logo" href="#"><span class="logo-mark"><i></i><i></i><i></i><i></i></span>ヘヤマド<small>heyamado.example</small></a>
    <nav><a href="#">できること</a><a href="#">料金</a><a href="#">導入の流れ</a><a href="#">よくある質問</a></nav>
    <div class="actions"><a class="btn btn-ghost" href="#">ログイン</a><a class="btn btn-primary" href="#">30 日間 無料で試す</a></div>
  </header>
  <section class="lp-hero">
    <div>
      <div class="eyebrow">MEETING ROOM BOOKING</div>
      <h1>会議室は、<br>探すものから、<br><em>すぐ見つかる</em>ものへ。</h1>
      <p class="lead">人数と時間を選ぶだけ。空いている部屋が、建物の窓のように灯ります。使われなかった予約は自動で解放され、部屋がもっと回ります。</p>
      <div class="cta"><a class="btn btn-primary" href="#">30 日間 無料で試す</a><a class="btn btn-ghost" href="#">画面を見る</a></div>
      <dl class="facts">
        <div><dt>SETUP</dt><dd>部屋の一覧を読み込むだけ</dd></div>
        <div><dt>CALENDAR</dt><dd>予定表に招待を自動で送信</dd></div>
        <div><dt>CHECK-IN</dt><dd>10 分で未使用を自動解放</dd></div>
      </dl>
    </div>
    <div class="lp-visual">
      <div class="facade" id="facade"></div>
      <div class="street"></div>
      <div class="lp-caption"><span>11 月 14 日（金）14:00–15:00・6 名</span><span class="key"><span><i></i>空き</span><span><i class="off"></i>使用中・条件外</span></span></div>
    </div>
  </section>
</div>
<script src="facade.js"></script>
<script>drawFacade(document.getElementById("facade"), { cols: 5 });</script>
</body>
</html>
